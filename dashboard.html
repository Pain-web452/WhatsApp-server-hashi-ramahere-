<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RK RAJA XWD</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020504;
    color: #00ff73;
    font-family: monospace;
}

body:before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,255,100,.025),
            rgba(0,255,100,.025) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 5;
}

.container {
    width: min(1000px, 94%);
    margin: auto;
    padding: 18px 0 40px;
}

.header {
    border: 1px solid #00ff73;
    border-radius: 18px;
    padding: 30px 15px;
    text-align: center;

    background: rgba(0,20,10,.8);

    box-shadow:
        0 0 25px rgba(0,255,100,.15),
        inset 0 0 25px rgba(0,255,100,.04);
}

.logo {
    font-size: clamp(30px,8vw,58px);
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00ff73,
        0 0 30px #00ff73;
}

.subtitle {
    margin-top: 10px;
    color: #7dffad;
    letter-spacing: 4px;
}

.status {
    margin-top: 18px;

    border: 1px solid #164d2d;
    border-radius: 14px;

    padding: 18px;

    background: rgba(0,15,8,.8);
}

.dot {
    display: inline-block;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #777;

    margin-right: 8px;
}

.dot.online {
    background: #00ff73;

    box-shadow:
        0 0 10px #00ff73,
        0 0 25px #00ff73;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 18px;
}

.panel {
    border: 1px solid #14552f;
    border-radius: 15px;
    padding: 20px;

    background: rgba(0,15,8,.86);
}

.title {
    color: #c0ffd7;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

input,
textarea {
    width: 100%;

    background: #010302;

    border: 1px solid #176136;
    border-radius: 9px;

    color: #00ff73;

    padding: 13px;

    outline: none;

    font-family: monospace;

    margin-bottom: 12px;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #00ff73;

    box-shadow:
        0 0 12px rgba(0,255,100,.2);
}

button {
    width: 100%;

    border: 1px solid #00ff73;
    border-radius: 9px;

    background: #031b0d;

    color: #00ff73;

    padding: 13px;

    font-family: monospace;
    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

button:hover {
    background: #06351a;

    box-shadow:
        0 0 15px rgba(0,255,100,.3);
}

.codebox {
    text-align: center;

    border: 1px dashed #176136;

    border-radius: 12px;

    padding: 28px 10px;

    margin-top: 10px;
}

.code {
    font-size: 38px;
    letter-spacing: 8px;
    font-weight: bold;

    text-shadow:
        0 0 10px #00ff73,
        0 0 25px #00ff73;
}

.file {
    border: 1px dashed #176136;
    padding: 15px;
    border-radius: 9px;
    margin-bottom: 12px;
}

.json-status {
    font-size: 12px;
    margin-top: 10px;
    color: #777;
}

.json-status.loaded {
    color: #00ff73;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.stat {
    text-align: center;
    border: 1px solid #123e24;
    border-radius: 10px;
    padding: 15px;
}

.stat b {
    display: block;
    font-size: 25px;
    margin-top: 8px;
}

.terminal {
    height: 260px;
    overflow-y: auto;

    background: #000;

    border: 1px solid #12351f;
    border-radius: 10px;

    padding: 13px;

    font-size: 12px;

    line-height: 1.8;
}

.log {
    word-break: break-word;
}

.log:before {
    content: "> ";
    color: #00ff73;
}

.full {
    grid-column: 1 / -1;
}

@media(max-width:700px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .logo {
        letter-spacing: 2px;
    }

}

</style>

</head>

<body>

<div class="container">

<header class="header">

    <div class="logo">
        RK RAJA XWD
    </div>

    <div class="subtitle">
        // SECURE CONTROL TERMINAL //
    </div>

</header>


<div class="status">

    <span id="dot" class="dot"></span>

    STATUS:
    <span id="status">
        CONNECTING...
    </span>

</div>


<div class="grid">


<!-- LOGIN -->

<section class="panel">

<div class="title">
[ WHATSAPP LOGIN ]
</div>

<input
    id="phone"
    placeholder="+91 9876543210"
    type="tel"
>

<button onclick="pair()">
    GENERATE PAIRING CODE
</button>

<div class="codebox">

    <div>
        PAIRING CODE
    </div>

    <div
        id="code"
        class="code"
    >
        ----
    </div>

    <small>
        WhatsApp → Linked Devices →
        Link with phone number
    </small>

</div>

</section>


<!-- JSON -->

<section class="panel">

<div class="title">
[ SESSION JSON ]
</div>

<div class="file">

<input
    id="jsonFile"
    type="file"
    accept=".json,application/json"
>

<button onclick="uploadJSON()">
    UPLOAD JSON
</button>

</div>

<div>
    OR PASTE JSON
</div>

<textarea
    id="jsonText"
    placeholder='{"example":"value"}'
></textarea>

<button onclick="pasteJSON()">
    LOAD PASTED JSON
</button>

<button onclick="clearJSON()">
    CLEAR
</button>

<div
    id="jsonStatus"
    class="json-status"
>
    ● JSON: NOT LOADED
</div>

</section>


<!-- MESSAGE -->

<section class="panel">

<div class="title">
[ SEND MESSAGE ]
</div>

<input
    id="recipient"
    placeholder="Number / Group UID"
>

<input
    id="header"
    value="RK RAJA XWD"
    placeholder="Header Name"
>

<textarea
    id="message"
    placeholder="Message..."
></textarea>

<label>
TXT File
</label>

<input
    id="txtFile"
    type="file"
    accept=".txt"
>

<label>
Send Time
</label>

<input
    id="sendTime"
    type="time"
>

<button onclick="sendMessage()">
    SEND MESSAGE
</button>

</section>


<!-- DASHBOARD -->

<section class="panel">

<div class="title">
[ DASHBOARD ]
</div>

<div class="stats">

<div class="stat">
Connection
<b id="connectionStat">
OFF
</b>
</div>

<div class="stat">
Sent
<b id="sent">
0
</b>
</div>

<div class="stat">
Failed
<b id="failed">
0
</b>
</div>

</div>

</section>


<!-- TERMINAL -->

<section class="panel full">

<div class="title">
[ SYSTEM TERMINAL ]
</div>

<div
    id="terminal"
    class="terminal"
></div>

</section>

</div>

</div>


<script>

/* =====================================================
   HELPERS
===================================================== */

function show(message) {
    alert(message);
}


/* =====================================================
   PAIR
===================================================== */

async function pair() {

    const phone =
        document.getElementById("phone").value;

    if (!phone.trim()) {
        show("Phone number enter karo.");
        return;
    }

    try {

        const response =
            await fetch("/api/pair", {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    phone
                })
            });

        const data =
            await response.json();

        if (!data.ok) {
            show(data.error || "Pairing failed.");
            return;
        }

        if (data.code) {
            document.getElementById("code")
                .textContent = data.code;
        }

    } catch (error) {

        show("Server connection failed.");

    }
}


/* =====================================================
   JSON PASTE
===================================================== */

async function pasteJSON() {

    const json =
        document.getElementById("jsonText")
            .value;

    if (!json.trim()) {
        show("JSON paste karo.");
        return;
    }

    const response =
        await fetch("/api/json/paste", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                json
            })
        });

    const data =
        await response.json();

    if (!data.ok) {
        show(data.error);
        return;
    }

    document.getElementById("jsonStatus")
        .textContent =
        "● JSON: LOADED";

    document.getElementById("jsonStatus")
        .classList.add("loaded");

    show("JSON successfully loaded.");
}


/* =====================================================
   JSON UPLOAD
===================================================== */

async function uploadJSON() {

    const input =
        document.getElementById("jsonFile");

    if (!input.files.length) {
        show("JSON file select karo.");
        return;
    }

    const form =
        new FormData();

    form.append(
        "jsonFile",
        input.files[0]
    );

    const response =
        await fetch("/api/json/upload", {
            method: "POST",
            body: form
        });

    const data =
        await response.json();

    if (!data.ok) {
        show(data.error);
        return;
    }

    document.getElementById("jsonStatus")
        .textContent =
        "● JSON: LOADED";

    document.getElementById("jsonStatus")
        .classList.add("loaded");

    show("JSON file loaded.");
}


/* =====================================================
   CLEAR JSON
===================================================== */

async function clearJSON() {

    await fetch("/api/json/clear", {
        method: "POST"
    });

    document.getElementById("jsonText")
        .value = "";

    document.getElementById("jsonFile")
        .value = "";

    document.getElementById("jsonStatus")
        .textContent =
        "● JSON: NOT LOADED";

    document.getElementById("jsonStatus")
        .classList.remove("loaded");
}


/* =====================================================
   TXT FILE
===================================================== */

document.getElementById("txtFile")
    .addEventListener("change", async function() {

        if (!this.files.length) return;

        const file =
            this.files[0];

        const text =
            await file.text();

        document.getElementById("message")
            .value = text;

    });


/* =====================================================
   SEND
===================================================== */

async function sendMessage() {

    const recipient =
        document.getElementById("recipient")
            .value;

    const header =
        document.getElementById("header")
            .value;

    const message =
        document.getElementById("message")
            .value;

    if (!recipient.trim()) {
        show("Recipient / Group UID enter karo.");
        return;
    }

    if (!message.trim()) {
        show("Message enter karo.");
        return;
    }

    const response =
        await fetch("/api/message", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                recipient,
                header,
                message
            })
        });

    const data =
        await response.json();

    if (!data.ok) {
        show(data.error);
        return;
    }

    show("Message sent.");
}


/* =====================================================
   LIVE EVENTS
===================================================== */

const events =
    new EventSource("/events");

events.onmessage =
    event => {

        const data =
            JSON.parse(event.data);

        const dot =
            document.getElementById("dot");

        const status =
            document.getElementById("status");

        if (data.connected) {

            dot.classList.add("online");

            status.textContent =
                "ONLINE";

            status.style.color =
                "#00ff73";

            document.getElementById(
                "connectionStat"
            ).textContent = "ON";

        } else {

            dot.classList.remove("online");

            status.textContent =
                data.connecting
                    ? "CONNECTING..."
                    : "OFFLINE";

            status.style.color =
                data.connecting
                    ? "#ffe66d"
                    : "#ff5555";

            document.getElementById(
                "connectionStat"
            ).textContent = "OFF";
        }

        if (data.pairingCode) {

            document.getElementById("code")
                .textContent =
                data.pairingCode;
        }

        document.getElementById("sent")
            .textContent =
            data.sentCount || 0;

        document.getElementById("failed")
            .textContent =
            data.failedCount || 0;

        const jsonStatus =
            document.getElementById(
                "jsonStatus"
            );

        if (data.jsonLoaded) {

            jsonStatus.textContent =
                "● JSON: LOADED";

            jsonStatus.classList.add(
                "loaded"
            );
        }

        const terminal =
            document.getElementById(
                "terminal"
            );

        terminal.innerHTML = "";

        (data.logs || []).forEach(line => {

            const div =
                document.createElement("div");

            div.className = "log";

            div.textContent = line;

            terminal.appendChild(div);

        });

        terminal.scrollTop =
            terminal.scrollHeight;
    };

</script>

</body>
</html>
